[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-food-viewpoint-sim"
version = "0.2.0"
description = "MuJoCo myCobot Pro 630 eye-in-hand constrained viewpoint acquisition"
requires-python = ">=3.11,<3.14"
dependencies = ["mujoco==3.3.7", "numpy>=1.26,<3", "scipy>=1.12,<2", "Pillow>=10,<14"]

[project.scripts]
viewpoint-sim = "viewpoint_sim.cli:main"

[tool.setuptools]
packages = ["viewpoint_sim", "viewpoint_sim.assets", "viewpoint_sim.configs"]

[tool.setuptools.package-dir]
"viewpoint_sim.assets" = "assets"
"viewpoint_sim.configs" = "configs"

[tool.setuptools.package-data]
"viewpoint_sim.assets" = ["mycobot_pro_630/*.urdf", "mycobot_pro_630/*.srdf", "mycobot_pro_630/*.obj", "mycobot_pro_630/*.json", "mycobot_pro_630/*.yaml", "mycobot_pro_630/LICENSE", "fonts/*.woff", "fonts/*.txt", "fonts/*.json"]
"viewpoint_sim.configs" = ["*.json"]
